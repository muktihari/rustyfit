name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always
  CLIPPY_TOOLCHAIN_VERSION: 1.98.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        run: rustup component add --toolchain $CLIPPY_TOOLCHAIN_VERSION-x86_64-unknown-linux-gnu clippy

      - name: Run clippy all with deny warnings
        run: cargo +$CLIPPY_TOOLCHAIN_VERSION clippy --verbose --all-targets --all-features -- -D warnings

      - name: Run cargo tests
        run: cargo test --verbose --all-features

  misspell:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - name: Set up misspell
        run: go install github.com/client9/misspell/cmd/misspell@b90dc15cfd220ecf8bbc9043ecb928cef381f011 # v0.3.4

      - name: Test misspelled words
        run: misspell -error .
